name: CI

# Merges to main are built, tested and released by release.yml.
on:
  pull_request:

# Pull requests (also from forks) only read the repository.
permissions:
  contents: read

# Linux, Windows (cross-compiled with MinGW-w64) and the Linux aarch64 handheld
# port (cross-compiled with Zig) build on Ubuntu; macOS builds on macOS.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runs-on: ubuntu-latest
            preset: release
          - name: windows
            runs-on: ubuntu-latest
            preset: windows-cross
          - name: anbernic
            runs-on: ubuntu-latest
            preset: anbernic
          # Not built from October 2026 until this workflow; it does not fail
          # the run until it is known to pass.
          - name: macos
            runs-on: macos-latest
            preset: release
            optional: true
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the v* tags, for the snapshot version
          persist-credentials: false
      - name: Cache the aarch64 toolchain
        if: matrix.preset == 'anbernic'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/keen4revamped/aarch64
          key: aarch64-toolchain-${{ hashFiles('packaging/anbernic/fetch-toolchain.sh') }}
      - name: Fetch the aarch64 toolchain
        # Zig and the arm64 headers, checked against pinned SHA-256 sums.
        if: matrix.preset == 'anbernic'
        run: sh packaging/anbernic/fetch-toolchain.sh
      - name: Install build dependencies
        # SDL3's Linux backends (and wayland-scanner, which the handheld build
        # runs too), plus MinGW-w64 for the Windows build.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev
          if [ "${{ matrix.preset }}" = windows-cross ]; then sudo apt-get install -y mingw-w64; fi
      - name: Configure
        # The build is the version this pull request will release, plus
        # -SNAPSHOT: the title's [MAJOR]/[MINOR]/[PATCH] tag picks the bump.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          bump=patch
          shopt -s nocasematch
          if [[ $PR_TITLE =~ ^[[:space:]]*\[(major|minor|patch)\] ]]; then
            bump=${BASH_REMATCH[1],,}
          fi
          shopt -u nocasematch
          cmake --preset ${{ matrix.preset }} -DKEEN4_VERSION_BUMP=$bump
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        # The cross-compiled Windows build has no tests (KEEN4_BUILD_TESTS=OFF).
        if: matrix.preset == 'release'
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: Upload Windows build
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: keen4-windows
          path: |
            build/windows/keen4.exe
            README.md
      - name: Package the handheld build
        if: matrix.name == 'anbernic'
        run: sh packaging/anbernic/make-package.sh build/anbernic keen4revamped-anbernic-aarch64.zip
      - name: Upload the handheld build
        # to try a pull request on a device before it is released
        if: matrix.name == 'anbernic'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: keen4-anbernic
          path: keen4revamped-anbernic-aarch64.zip
