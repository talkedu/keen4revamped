name: CI

# Merges to main are built, tested and released by release.yml.
on:
  pull_request:

# Linux and Windows build on the self-hosted runner in WSL (label "wsl");
# Windows is cross-compiled there with MinGW-w64. macOS is disabled for now:
# it needs a GitHub-hosted runner, which the Actions spending limit blocks.
# The repo is private, so only collaborators' pull requests reach the runner.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runs-on: [self-hosted, Linux, X64, wsl]
            preset: release
          - name: windows
            runs-on: [self-hosted, Linux, X64, wsl]
            preset: windows-cross
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the v* tags, for the snapshot version
      - name: Install SDL3 build dependencies
        # The self-hosted runner already has these (and has no passwordless sudo).
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev
      - name: Configure
        # The build is the version this pull request will release, plus
        # -SNAPSHOT: the title's [MAJOR]/[MINOR]/[PATCH] tag picks the bump.
        # KEEN4_GITHUB_CLIENT_ID is the OAuth app the in-game updater signs in
        # with (see README, Updating).
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          bump=patch
          shopt -s nocasematch
          if [[ $PR_TITLE =~ ^[[:space:]]*\[(major|minor|patch)\] ]]; then
            bump=${BASH_REMATCH[1],,}
          fi
          shopt -u nocasematch
          cmake --preset ${{ matrix.preset }} -DKEEN4_VERSION_BUMP=$bump \
            -DKEEN4_GITHUB_CLIENT_ID="${{ vars.KEEN4_GITHUB_CLIENT_ID }}"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        # The cross-compiled Windows build has no tests (KEEN4_BUILD_TESTS=OFF).
        if: matrix.preset == 'release'
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: Upload Windows build
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: keen4-windows
          path: |
            build/windows/keen4.exe
            README.md
