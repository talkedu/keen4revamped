name: Release

# Builds keen4 for Windows and Linux and publishes a GitHub release.
# Run it from the Actions tab (or push a v* tag). Game data is never packaged:
# players supply their own copy of Keen 4.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v1.2
        required: true
        default: v1.2.1
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

# Linux and Windows build on the self-hosted runner in WSL (label "wsl");
# Windows is cross-compiled there with MinGW-w64. macOS is disabled for now:
# it needs a GitHub-hosted runner, which the Actions spending limit blocks.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runs-on: [self-hosted, Linux, X64, wsl]
            preset: windows-cross
          - name: linux-x64
            runs-on: [self-hosted, Linux, X64, wsl]
            preset: release
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 build dependencies
        # The self-hosted runner already has these (and has no passwordless sudo).
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        # The cross-compiled Windows build has no tests (KEEN4_BUILD_TESTS=OFF).
        if: matrix.preset == 'release'
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: Package (Windows)
        if: matrix.preset == 'windows-cross'
        run: |
          dir="keen4revamped-$TAG-${{ matrix.name }}"
          mkdir -p "$dir/docs" "$dir/tools/keen4-upscale" "$dir/tools/keen4-curate"
          cp build/windows/keen4.exe build/windows/keen4-extract.exe README.md "$dir"
          cp docs/ART.md docs/AUDIO.md docs/LANGUAGES.md "$dir/docs"
          cp tools/keen4-upscale/keen4_upscale.py "$dir/tools/keen4-upscale"
          cp tools/keen4-curate/keen4_curate.py "$dir/tools/keen4-curate"
          zip -qr "$dir.zip" "$dir"
      - name: Package (Linux)
        if: matrix.preset == 'release'
        run: |
          dir="keen4revamped-$TAG-${{ matrix.name }}"
          mkdir -p "$dir/docs" "$dir/tools/keen4-upscale" "$dir/tools/keen4-curate"
          cp build/release/keen4 build/release/keen4-extract README.md "$dir"
          cp docs/ART.md docs/AUDIO.md docs/LANGUAGES.md "$dir/docs"
          cp tools/keen4-upscale/keen4_upscale.py "$dir/tools/keen4-upscale"
          cp tools/keen4-curate/keen4_curate.py "$dir/tools/keen4-curate"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            keen4revamped-*.zip
            keen4revamped-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: [self-hosted, Linux, X64, wsl]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: keen4revamped ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body: |
            keen4revamped v1.2.1 finds your game data on its own. Gameplay is unchanged from v1.2.

            - Steam data lookup: `keen4` and `keen4-extract` no longer need `--data` when Keen 4 is installed through Steam. They look in `--data`, then `KEEN4_DATA_DIR`, then the current and program folders, then every Steam library on Windows, Linux (including Flatpak, Snap, SteamOS and Bazzite) and macOS, including extra library drives. File and folder names match in any case. If nothing is found, the error lists every folder it tried.
            - Builds for Windows and Linux below, each with `keen4`, `keen4-extract`, the art tools and the docs. macOS builds are still paused.

            Game data, art and audio are not included. You need your own copy of Keen 4 v1.4 EGA (KEEN4E.EXE and the .CK4 files, for example from the Steam release). See README.md.

            Full changes: https://github.com/talkedu/keen4revamped/compare/v1.2...${{ env.TAG }}
          files: dist/*
          fail_on_unmatched_files: true
