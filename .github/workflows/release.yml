name: Release

# Builds keen4 for Windows, Linux and macOS and publishes a GitHub release.
# Run it from the Actions tab (or push a v* tag). Game data is never packaged:
# players supply their own copy of Keen 4.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v1.0
        required: true
        default: v1.0
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev \
            libasound2-dev libpulse-dev
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "keen4revamped-$env:TAG-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item build/release/Release/keen4.exe, README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          dir="keen4revamped-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          cp build/release/keen4 README.md "$dir"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            keen4revamped-*.zip
            keen4revamped-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: keen4revamped ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body: |
            First playable release of keen4revamped, a C++ port of Commander Keen 4 (v1.4 EGA) built from our own decompilation.

            - The whole game at the original 320x200: title, demos, control panel, world map, all levels and enemies, save/load, high scores, help screens, AdLib music and sound effects.
            - Not ported yet: the scrolling intro, the story crawl, mouse and DOS joystick input.
            - Builds for Windows, Linux and macOS (Apple Silicon) below.

            Game data is not included. You need your own copy of Keen 4 v1.4 EGA (KEEN4E.EXE and the .CK4 files, for example from the Steam release); run `keen4 --data path/to/keen4`. See README.md.
          files: dist/*
          fail_on_unmatched_files: true
