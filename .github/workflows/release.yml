name: Release

# Every merge to main is released: the version is bumped from the latest v*
# tag, Windows, Linux and the Linux aarch64 handheld port are built with that
# version, and a GitHub release is
# published with notes from the merged pull request.
#
# The pull request title picks the bump: "[MAJOR] Title", "[MINOR] Title" or
# "[PATCH] Title". A title without a tag is a patch.
#
# Game data is never packaged: players supply their own copy of Keen 4.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  version:
    runs-on: [self-hosted, Linux, X64, wsl]
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the next version and reserve its tag
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                 --jq '[.[] | select(.merged_at != null)] | .[0] // empty')
          if [ -n "$pr" ]; then
            title=$(jq -r .title <<<"$pr")
            body=$(jq -r '.body // ""' <<<"$pr")
            number=$(jq -r .number <<<"$pr")
          else
            # pushed straight to main, not through a pull request
            title=$(git log -1 --format=%s "$GITHUB_SHA")
            body=$(git log -1 --format=%b "$GITHUB_SHA")
            number=
          fi

          bump=patch
          shopt -s nocasematch
          if [[ $title =~ ^[[:space:]]*\[(major|minor|patch)\][[:space:]]*(.*)$ ]]; then
            bump=${BASH_REMATCH[1],,}
            title=${BASH_REMATCH[2]}
          fi
          shopt -u nocasematch

          # The tag is pushed before the build, so merges released at the same
          # time never pick the same version: if another run took it, bump again.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet --force --tags origin
            prev=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -n1 || true)
            IFS=. read -r major minor patch <<<"${prev#v}"
            major=${major:-0} minor=${minor:-0} patch=${patch:-0}
            case $bump in
              major) major=$((major + 1)) minor=0 patch=0 ;;
              minor) minor=$((minor + 1)) patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            version="$major.$minor.$patch"
            tag="v$version"
            git tag "$tag" "$GITHUB_SHA"
            if git push --quiet origin "refs/tags/$tag"; then
              break
            fi
            git tag -d "$tag"
            if [ "$attempt" = 5 ]; then
              echo "::error::could not reserve a release tag"
              exit 1
            fi
            sleep 5
          done
          echo "Releasing $tag ($bump bump from ${prev:-no previous tag})"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "notes<<KEEN4_NOTES_EOF"
            echo "## $title"
            echo
            if [ -n "$body" ]; then
              printf '%s\n\n' "$body"
            fi
            echo "Game data, art and audio are not included. You need your own copy of Keen 4 v1.4 EGA (KEEN4E.EXE and the .CK4 files, for example from the Steam release). See README.md."
            echo
            if [ -n "$number" ]; then
              echo "Pull request: https://github.com/$GITHUB_REPOSITORY/pull/$number"
            fi
            if [ -n "$prev" ]; then
              echo "Full changes: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$tag"
            fi
            echo "KEEN4_NOTES_EOF"
          } >>"$GITHUB_OUTPUT"

  # Linux and Windows build on the self-hosted runner in WSL (label "wsl");
  # Windows is cross-compiled there with MinGW-w64. macOS is disabled for now:
  # it needs a GitHub-hosted runner, which the Actions spending limit blocks.
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runs-on: [self-hosted, Linux, X64, wsl]
            preset: windows-cross
          - name: linux-x64
            runs-on: [self-hosted, Linux, X64, wsl]
            preset: release
          # Anbernic and other Linux aarch64 handhelds, cross-compiled with Zig
          # (see packaging/anbernic); a PortMaster-style port zip.
          - name: anbernic-aarch64
            runs-on: [self-hosted, Linux, X64, wsl]
            preset: anbernic
    runs-on: ${{ matrix.runs-on }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the aarch64 toolchain
        # Zig and the arm64 headers are cached in ~/.cache on the runner.
        if: matrix.preset == 'anbernic'
        run: sh packaging/anbernic/fetch-toolchain.sh
      - name: Install SDL3 build dependencies
        # The self-hosted runner already has these (and has no passwordless sudo).
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev
      - name: Configure
        # the OAuth app the in-game updater signs in with (see README, Updating)
        run: cmake --preset ${{ matrix.preset }} -DKEEN4_VERSION="$VERSION" -DKEEN4_GITHUB_CLIENT_ID="${{ vars.KEEN4_GITHUB_CLIENT_ID }}"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        # The cross-compiled Windows build has no tests (KEEN4_BUILD_TESTS=OFF).
        if: matrix.preset == 'release'
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: Package (Windows)
        if: matrix.preset == 'windows-cross'
        run: |
          dir="keen4revamped-$TAG-${{ matrix.name }}"
          mkdir -p "$dir/docs" "$dir/tools/keen4-upscale" "$dir/tools/keen4-curate"
          cp build/windows/keen4.exe build/windows/keen4-extract.exe README.md "$dir"
          cp docs/ART.md docs/AUDIO.md docs/LANGUAGES.md "$dir/docs"
          cp tools/keen4-upscale/keen4_upscale.py "$dir/tools/keen4-upscale"
          cp tools/keen4-curate/keen4_curate.py "$dir/tools/keen4-curate"
          zip -qr "$dir.zip" "$dir"
      - name: Installer (Windows)
        # NSIS builds the setup .exe on Linux. The runner has no passwordless
        # sudo, so without a system makensis the Ubuntu package is unpacked locally.
        if: matrix.preset == 'windows-cross'
        run: |
          if command -v makensis >/dev/null; then
            makensis=makensis
          else
            nsis="$RUNNER_TEMP/nsis"
            rm -rf "$nsis" && mkdir -p "$nsis" && cd "$nsis"
            apt-get download nsis nsis-common
            for deb in *.deb; do dpkg -x "$deb" root; done
            cd "$GITHUB_WORKSPACE"
            export NSISDIR="$nsis/root/usr/share/nsis"
            makensis="$nsis/root/usr/bin/makensis"
          fi
          dir="keen4revamped-$TAG-${{ matrix.name }}"
          "$makensis" -V2 -DVERSION="$VERSION" -DSRCDIR="$PWD/$dir" \
            -DOUTFILE="$PWD/$dir-installer.exe" packaging/windows/keen4revamped.nsi
      - name: Package (Linux)
        if: matrix.preset == 'release'
        run: |
          dir="keen4revamped-$TAG-${{ matrix.name }}"
          mkdir -p "$dir/docs" "$dir/tools/keen4-upscale" "$dir/tools/keen4-curate"
          cp build/release/keen4 build/release/keen4-extract README.md "$dir"
          cp packaging/linux/install.sh packaging/linux/uninstall.sh packaging/icon/keen4revamped.png "$dir"
          cp docs/ART.md docs/AUDIO.md docs/LANGUAGES.md "$dir/docs"
          cp tools/keen4-upscale/keen4_upscale.py "$dir/tools/keen4-upscale"
          cp tools/keen4-curate/keen4_curate.py "$dir/tools/keen4-curate"
          tar czf "$dir.tar.gz" "$dir"
          sh packaging/linux/make-installer.sh "$dir" "$dir-installer.sh"
      - name: Package (Anbernic)
        # The zip goes in the handheld's ports folder; the .tar.gz is what the
        # in-game updater installs there.
        if: matrix.preset == 'anbernic'
        run: |
          sh packaging/anbernic/make-package.sh build/anbernic \
            "keen4revamped-$TAG-${{ matrix.name }}.zip" "keen4revamped-$TAG-linux-aarch64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            keen4revamped-*.zip
            keen4revamped-*.tar.gz
            keen4revamped-*-installer.exe
            keen4revamped-*-installer.sh
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: [self-hosted, Linux, X64, wsl]
    steps:
      # the self-hosted runner keeps its workspace between runs
      - name: Clear earlier downloads
        run: rm -rf dist notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" >notes.md
          # The tag already exists (reserved above); --target only matters if
          # someone deleted it before this job ran.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "keen4revamped $TAG" --notes-file notes.md --target "$GITHUB_SHA"
