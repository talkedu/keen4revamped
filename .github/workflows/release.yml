name: Release

# Builds keen4 for Windows, Linux and macOS and publishes a GitHub release.
# Run it from the Actions tab (or push a v* tag). Game data is never packaged:
# players supply their own copy of Keen 4.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v1.1
        required: true
        default: v1.1
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev \
            libasound2-dev libpulse-dev
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "keen4revamped-$env:TAG-${{ matrix.name }}"
          New-Item -ItemType Directory $dir, "$dir/docs", "$dir/tools/keen4-upscale" | Out-Null
          Copy-Item build/release/Release/keen4.exe, build/release/Release/keen4-extract.exe, README.md $dir
          Copy-Item docs/ART.md "$dir/docs"
          Copy-Item tools/keen4-upscale/keen4_upscale.py "$dir/tools/keen4-upscale"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          dir="keen4revamped-$TAG-${{ matrix.name }}"
          mkdir -p "$dir/docs" "$dir/tools/keen4-upscale"
          cp build/release/keen4 build/release/keen4-extract README.md "$dir"
          cp docs/ART.md "$dir/docs"
          cp tools/keen4-upscale/keen4_upscale.py "$dir/tools/keen4-upscale"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            keen4revamped-*.zip
            keen4revamped-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: keen4revamped ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body: |
            keen4revamped v1.1 adds the remaster renderer: Keen 4 in 16:9 at your screen's resolution, with smooth motion and a pipeline for new art. Levels and physics are unchanged.

            - The remaster view is now the default: 356x200 in 16:9 at the window's native resolution, the original map border kept hidden, and the camera and sprites interpolated between game frames at the display's refresh rate. The status window and dialogs are drawn as in the original.
            - F11 switches between the remaster and the classic 320x200 view (or start with `--classic`). The classic view is unchanged from v1.0.
            - Art: the remaster loads new art from `art/manifest.txt` (`--art DIR`, F12 reloads it). Anything without new art is the original scaled 4x (Scale4x, or `--nearest` for plain pixels). Collision boxes always come from the original, so art cannot change gameplay.
            - New tools for making that art from your own copy of the game: `keen4-extract` exports every tile, sprite and picture as PNG, and `tools/keen4-upscale/keen4_upscale.py` builds a 4x set with Scale4x or the Real-ESRGAN AI upscaler, upscaling tiles together with their level neighbours so edges match, and writes a review page. See docs/ART.md.
            - Builds for Windows, Linux and macOS (Apple Silicon) below, each with `keen4`, `keen4-extract`, the upscale script and the docs.

            Game data and art are not included. You need your own copy of Keen 4 v1.4 EGA (KEEN4E.EXE and the .CK4 files, for example from the Steam release); run `keen4 --data path/to/keen4`. Art made from it with the tools stays on your machine. See README.md.

            Full changes: https://github.com/talkedu/keen4revamped/compare/v1.0...${{ env.TAG }}
          files: dist/*
          fail_on_unmatched_files: true
